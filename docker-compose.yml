services:
  find-my-timeline:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/app/data
      - ./session:/root/.find-my-timeline
    env_file:
      - .env
    environment:
      WEB_HOST: 0.0.0.0
      RUSTPUSH_BRIDGE_BIN: /app/rustpush_bridge/target/release/find-my-rustpush-bridge
      RUSTPUSH_STATE_DIR: /root/.find-my-timeline/rustpush
      RUSTPUSH_BRIDGE_DELEGATE: ${RUSTPUSH_BRIDGE_DELEGATE:-}
      RUSTPUSH_ALLOW_CONTRACT_MODE: ${RUSTPUSH_ALLOW_CONTRACT_MODE:-false}
    restart: unless-stopped
